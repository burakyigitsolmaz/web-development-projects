<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Evrimsel Tıklama Sayacı</title>
<style>
body {
  margin: 0; padding: 0; height: 100vh; width: 100vw;
  display: flex; justify-content: center; align-items: center; flex-direction: column;
  overflow: hidden; font-family: 'Arial Black', sans-serif;
  background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
  background-size: 400% 400%;
  animation: gradyanHareketi 15s ease infinite;
}

@keyframes gradyanHareketi {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

#sayaç {
  font-size: 6em; color: white; text-shadow: 8px 8px 0px #000;
  z-index: 100; user-select: none; margin-bottom: 20px;
}

.buton-konteynir { position: relative; }

.buton {
  background-color: #fff; border-radius: 50%; width: 160px; height: 160px;
  font-size: 1.2em; font-weight: 900; cursor: pointer; border: 6px solid #000;
  box-shadow: 0 10px 0 #000; transition: all 0.1s; z-index: 100; position: relative;
}

.buton:active { transform: scale(0.9) translateY(10px); box-shadow: 0 0px 0 #000; }

/* --- EFEKT KÜTÜPHANESİ --- */

/* 1. Halka Efekti (1-10) */
.halka {
  position: absolute; border: 4px solid white; border-radius: 50%;
  pointer-events: none; z-index: 50; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation: halkaAnim 0.6s ease-out forwards;
}
@keyframes halkaAnim {
  0% { width: 0; height: 0; opacity: 1; }
  100% { width: 500px; height: 500px; opacity: 0; }
}

/* 2. Kare Patlaması (11-20) */
.kare {
  position: absolute; background: white; pointer-events: none; z-index: 50;
  top: 50%; left: 50%; animation: kareAnim 0.8s ease-out forwards;
}
@keyframes kareAnim {
  0% { transform: translate(-50%, -50%) rotate(0deg); width: 0; height: 0; opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) rotate(180deg); width: 50px; height: 50px; opacity: 0; }
}

/* 3. Lazer Çizgileri (21-30) */
.lazer {
  position: absolute; background: white; width: 2px; height: 100vh;
  top: 50%; left: 50%; transform-origin: top;
  animation: lazerAnim 0.5s ease-out forwards;
}
@keyframes lazerAnim {
  0% { transform: rotate(var(--deg)) scaleY(0); opacity: 1; }
  100% { transform: rotate(var(--deg)) scaleY(1.5); opacity: 0; }
}

/* 4. Parlama Efekti (31-40) */
.parlama {
  position: absolute; width: 200vw; height: 200vh; background: white;
  top: -50vh; left: -50vw; pointer-events: none; z-index: 200;
  animation: flashAnim 0.3s ease-out forwards;
}
@keyframes flashAnim { 0% { opacity: 0.8; } 100% { opacity: 0; } }

</style>
</head>
<body>

<div id="sayaç">0</div>

<div class="buton-konteynir" id="container">
  <button class="buton" onclick="tikla()">BAŞLA!</button>
</div>

<script>
let sayac = 0;
const container = document.getElementById('container');

function tikla() {
  sayac++;
  document.getElementById('sayaç').textContent = sayac;

  if (sayac <= 10) {
    efektHalka();
  } else if (sayac <= 20) {
    efektKare();
  } else if (sayac <= 30) {
    efektLazer();
  } else if (sayac <= 40) {
    efektFlas();
  } else {
    // 40'tan sonra hepsini karışık yapalım
    const r = Math.random();
    if(r < 0.25) efektHalka();
    else if(r < 0.5) efektKare();
    else if(r < 0.75) efektLazer();
    else efektFlas();
  }
}

// 1. SEVİYE: Halkalar
function efektHalka() {
  const h = document.createElement('div');
  h.className = 'halka';
  container.appendChild(h);
  setTimeout(() => h.remove(), 600);
}

// 2. SEVİYE: Uçan Kareler
function efektKare() {
  for(let i=0; i<6; i++) {
    const k = document.createElement('div');
    k.className = 'kare';
    k.style.setProperty('--tx', (Math.random()-0.5)*600 + "px");
    k.style.setProperty('--ty', (Math.random()-0.5)*600 + "px");
    container.appendChild(k);
    setTimeout(() => k.remove(), 800);
  }
}

// 3. SEVİYE: Lazerler
function efektLazer() {
  for(let i=0; i<8; i++) {
    const l = document.createElement('div');
    l.className = 'lazer';
    l.style.setProperty('--deg', (i * 45) + "deg");
    container.appendChild(l);
    setTimeout(() => l.remove(), 500);
  }
}

// 4. SEVİYE: Ekran Parlaması (Flash)
function efektFlas() {
  const f = document.createElement('div');
  f.className = 'parlama';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 300);
}
</script>
</body>
</html>
</html>
